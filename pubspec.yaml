name: map_local
description: "Flutter Desktop-Anwendung mit Offline-Kartendarstellung für Hessen (Demo-/Referenz-App für das Package local_map)"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Die Kartenbibliothek dieses Repos. Liegt unter packages/local_map und
  # kann von anderen Projekten per path:- oder git:-Dependency eingebunden
  # werden - siehe packages/local_map/README.md.
  local_map:
    path: packages/local_map

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Wird von den Regressionstests unter test/ direkt verwendet, um MBTiles
  # unter map/ zu inspizieren.
  sqlite3: ^3.3.0

  # Nur fuer den Test: setMockInitialValues haelt den Speicherort auf
  # `custom`, damit die Startseite ohne path_provider hochkommt.
  shared_preferences: ^2.3.0

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package.
  flutter_lints: ^6.0.0

# Diese Overrides muss jedes Projekt setzen, das local_map einbindet:
# dependency_overrides greifen nur im Root-Package und werden nicht
# transitiv vererbt.
dependency_overrides:
  # Fork mit einstellbarem panBuffer und rasterTileScale, siehe
  # MapConfig.panBuffer / MapConfig.rasterTileScale.
  vector_map_tiles:
    git:
      url: https://github.com/DerKleinePunk/flutter-vector-map-tiles
      ref: local_map_pi
  flutter_map_mbtiles:
    git:
      url: https://github.com/DerKleinePunk/flutter_map_plugins
      ref: to_flutter_map_8
      path: flutter_map_mbtiles
  vector_map_tiles_mbtiles:
    git:
      url: https://github.com/DerKleinePunk/flutter_map_plugins
      ref: to_flutter_map_8
      path: vector_map_tiles_mbtiles

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Die Kartenstyles liegen jetzt als Package-Assets in
  # packages/local_map/assets/maps/ und werden von dort automatisch
  # mitgebundelt.
